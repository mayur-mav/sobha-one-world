<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590" style="background:#faf8f5;">
  <defs>
    <!-- Architectural grid pattern -->
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ede7dc" stroke-width="0.75" />
    </pattern>
    <linearGradient id="goldLine" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c5a059" stop-opacity="1" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="820" height="590" fill="#faf8f5" />
  <rect width="820" height="590" fill="url(#archGrid)" opacity="0.65" />

  <!-- Outer Architectural Blueprint Frame -->
  <rect x="18" y="18" width="784" height="554" fill="none" stroke="#ede7dc" stroke-width="1.5" rx="4" />
  <rect x="24" y="24" width="772" height="542" fill="none" stroke="#181613" stroke-width="1" opacity="0.25" rx="2" />

  <!-- Top Title Header -->
  <g id="title-block">
    <text x="40" y="52" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#785317" letter-spacing="0.14em">SOBHA ONE WORLD</text>
    <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#8c8275" letter-spacing="0.08em">HOSKOTE · GREATER WHITEFIELD · BENGALURU</text>
    
    <!-- Typology Badge -->
    <rect x="560" y="38" width="220" height="38" rx="6" fill="#181613" />
    <text x="670" y="54" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#c5a059" letter-spacing="0.08em">2 BHK RESIDENCE</text>
    <text x="670" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" opacity="0.85">1063 SQ FT SALEABLE</text>

    <!-- Gold Accent Line -->
    <rect x="40" y="84" width="740" height="1.5" fill="url(#goldLine)" />
  </g>

  <!-- Compass / North Marker -->
  <g transform="translate(740, 115)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#c5a059" stroke-width="1" />
    <polygon points="0,-12 4,0 0,-3 -4,0" fill="#785317" />
    <polygon points="0,12 4,0 0,3 -4,0" fill="#ede7dc" />
    <text x="0" y="-14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#181613">N</text>
  </g>

  <!-- Architectural Layout Rooms -->
  <g id="floor-layout" transform="translate(10, 15)">
    
      <!-- ENTRY FOYER -->
      <g class="room-group">
        <rect x="50" y="120" width="110" height="90" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="105" y="159" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">ENTRY FOYER</text>
        <text x="105" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">5&apos;0&quot; × 6&apos;6&quot;</text>
      </g>
    
      <!-- LIVING &amp; DINING -->
      <g class="room-group">
        <rect x="175" y="120" width="280" height="230" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="315" y="229" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">LIVING &amp; DINING</text>
        <text x="315" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">13&apos;0&quot; × 22&apos;0&quot;</text>
      </g>
    
      <!-- MAIN BALCONY -->
      <g class="room-group">
        <rect x="175" y="365" width="280" height="95" fill="#f6f2ea" stroke="#181613" stroke-width="2.5" rx="3" />
        <rect x="179" y="369" width="272" height="87" fill="none" stroke="#c5a059" stroke-width="1.2" stroke-dasharray="4,3" rx="2" />
        <text x="315" y="406.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">MAIN BALCONY</text>
        <text x="315" y="422.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">12&apos;6&quot; × 5&apos;0&quot;</text>
      </g>
    
      <!-- KITCHEN -->
      <g class="room-group">
        <rect x="50" y="225" width="110" height="145" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="105" y="291.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">KITCHEN</text>
        <text x="105" y="307.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">9&apos;0&quot; × 10&apos;6&quot;</text>
      </g>
    
      <!-- UTILITY -->
      <g class="room-group">
        <rect x="50" y="385" width="110" height="75" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="105" y="416.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">UTILITY</text>
        <text x="105" y="432.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">5&apos;0&quot; × 7&apos;0&quot;</text>
      </g>
    
      <!-- MASTER BEDROOM -->
      <g class="room-group">
        <rect x="470" y="120" width="175" height="190" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="557.5" y="209" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">MASTER BEDROOM</text>
        <text x="557.5" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">12&apos;6&quot; × 14&apos;6&quot;</text>
      </g>
    
      <!-- MASTER BATH -->
      <g class="room-group">
        <rect x="660" y="120" width="90" height="190" fill="#fcfbfa" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="705" y="209" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">MASTER BATH</text>
        <text x="705" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">5&apos;6&quot; × 8&apos;6&quot;</text>
      </g>
    
      <!-- BEDROOM 2 -->
      <g class="room-group">
        <rect x="470" y="325" width="175" height="135" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="557.5" y="386.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">BEDROOM 2</text>
        <text x="557.5" y="402.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">11&apos;0&quot; × 12&apos;6&quot;</text>
      </g>
    
      <!-- COMMON BATH -->
      <g class="room-group">
        <rect x="660" y="325" width="90" height="135" fill="#fcfbfa" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="705" y="386.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">COMMON BATH</text>
        <text x="705" y="402.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">5&apos;6&quot; × 8&apos;0&quot;</text>
      </g>
    
  </g>

  <!-- Bottom Specification Footer -->
  <g id="footer-block">
    <rect x="40" y="515" width="740" height="1.5" fill="url(#goldLine)" />
    <text x="40" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#181613">CONFIGURATION: <tspan fill="#785317">2 BHK — 1063 SQFT (G+46 TOWER)</tspan></text>
    <text x="40" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#6b7280">TOWER: 3B + G + 1ST (PARKING) + 46 FLOORS · RERA CARPET: 1050 - 1063 SQ FT</text>
    
    <text x="780" y="536" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#785317">PRICE: ₹1.60 - 1.70 Cr*</text>
    <text x="780" y="550" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#8c8275">*SCHEMATIC BLUEPRINT · AUTHORIZED CHANNEL PARTNER M&amp;A VENTURES</text>
  </g>
</svg>