<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590" style="background:#faf8f5;">
  <defs>
    <!-- Architectural grid pattern -->
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ede7dc" stroke-width="0.75" />
    </pattern>
    <linearGradient id="goldLine" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c5a059" stop-opacity="1" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="820" height="590" fill="#faf8f5" />
  <rect width="820" height="590" fill="url(#archGrid)" opacity="0.65" />

  <!-- Outer Architectural Blueprint Frame -->
  <rect x="18" y="18" width="784" height="554" fill="none" stroke="#ede7dc" stroke-width="1.5" rx="4" />
  <rect x="24" y="24" width="772" height="542" fill="none" stroke="#181613" stroke-width="1" opacity="0.25" rx="2" />

  <!-- Top Title Header -->
  <g id="title-block">
    <text x="40" y="52" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#785317" letter-spacing="0.14em">SOBHA ONE WORLD</text>
    <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#8c8275" letter-spacing="0.08em">HOSKOTE · GREATER WHITEFIELD · BENGALURU</text>
    
    <!-- Typology Badge -->
    <rect x="560" y="38" width="220" height="38" rx="6" fill="#181613" />
    <text x="670" y="54" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#c5a059" letter-spacing="0.08em">4 BHK GRANDE (2 CAR PARK)</text>
    <text x="670" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" opacity="0.85">2415 SQ FT SALEABLE</text>

    <!-- Gold Accent Line -->
    <rect x="40" y="84" width="740" height="1.5" fill="url(#goldLine)" />
  </g>

  <!-- Compass / North Marker -->
  <g transform="translate(740, 115)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#c5a059" stroke-width="1" />
    <polygon points="0,-12 4,0 0,-3 -4,0" fill="#785317" />
    <polygon points="0,12 4,0 0,3 -4,0" fill="#ede7dc" />
    <text x="0" y="-14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#181613">N</text>
  </g>

  <!-- Architectural Layout Rooms -->
  <g id="floor-layout" transform="translate(10, 15)">
    
      <!-- PALATIAL GALLERY FOYER -->
      <g class="room-group">
        <rect x="45" y="115" width="115" height="85" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="102.5" y="151.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">PALATIAL GALLERY FOYER</text>
        <text x="102.5" y="167.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">9&apos;0&quot; × 10&apos;6&quot;</text>
      </g>
    
      <!-- GREAT ROOM &amp; BANQUET DINING -->
      <g class="room-group">
        <rect x="175" y="115" width="285" height="235" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="317.5" y="226.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">GREAT ROOM &amp; BANQUET DINING</text>
        <text x="317.5" y="242.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">20&apos;0&quot; × 30&apos;0&quot;</text>
      </g>
    
      <!-- WRAP-AROUND VERANDAH -->
      <g class="room-group">
        <rect x="175" y="365" width="285" height="95" fill="#f6f2ea" stroke="#181613" stroke-width="2.5" rx="3" />
        <rect x="179" y="369" width="277" height="87" fill="none" stroke="#c5a059" stroke-width="1.2" stroke-dasharray="4,3" rx="2" />
        <text x="317.5" y="406.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">WRAP-AROUND VERANDAH</text>
        <text x="317.5" y="422.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">20&apos;0&quot; × 7&apos;0&quot;</text>
      </g>
    
      <!-- SHOW &amp; WET KITCHEN -->
      <g class="room-group">
        <rect x="45" y="215" width="115" height="155" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="102.5" y="286.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">SHOW &amp; WET KITCHEN</text>
        <text x="102.5" y="302.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">14&apos;0&quot; × 16&apos;0&quot;</text>
      </g>
    
      <!-- MAID SUITE &amp; UTILITY -->
      <g class="room-group">
        <rect x="45" y="385" width="115" height="75" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="102.5" y="416.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">MAID SUITE &amp; UTILITY</text>
        <text x="102.5" y="432.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">8&apos;0&quot; × 10&apos;0&quot;</text>
      </g>
    
      <!-- GRANDE MASTER SUITE -->
      <g class="room-group">
        <rect x="475" y="115" width="185" height="155" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="567.5" y="186.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">GRANDE MASTER SUITE</text>
        <text x="567.5" y="202.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">17&apos;6&quot; × 21&apos;0&quot;</text>
      </g>
    
      <!-- 5-FIXTURE LUXURY SPA -->
      <g class="room-group">
        <rect x="675" y="115" width="85" height="155" fill="#fcfbfa" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="717.5" y="186.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">5-FIXTURE LUXURY SPA</text>
        <text x="717.5" y="202.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">8&apos;0&quot; × 12&apos;0&quot;</text>
      </g>
    
      <!-- JUNIOR SUITE 2 + BATH -->
      <g class="room-group">
        <rect x="475" y="285" width="140" height="175" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="545" y="366.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">JUNIOR SUITE 2 + BATH</text>
        <text x="545" y="382.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">14&apos;0&quot; × 16&apos;0&quot;</text>
      </g>
    
      <!-- JUNIOR SUITE 3 + BATH -->
      <g class="room-group">
        <rect x="630" y="285" width="130" height="85" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="695" y="321.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">JUNIOR SUITE 3 + BATH</text>
        <text x="695" y="337.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">13&apos;6&quot; × 15&apos;0&quot;</text>
      </g>
    
      <!-- SUITE 4 / FAMILY LOUNGE -->
      <g class="room-group">
        <rect x="630" y="380" width="130" height="80" fill="#ffffff" stroke="#181613" stroke-width="2.5" rx="3" />
        
        <text x="695" y="414" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" fill="#181613" letter-spacing="0.04em">SUITE 4 / FAMILY LOUNGE</text>
        <text x="695" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#785317">13&apos;0&quot; × 14&apos;0&quot;</text>
      </g>
    
  </g>

  <!-- Bottom Specification Footer -->
  <g id="footer-block">
    <rect x="40" y="515" width="740" height="1.5" fill="url(#goldLine)" />
    <text x="40" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#181613">CONFIGURATION: <tspan fill="#785317">4 BHK GRANDE — 2415 SQFT (2 CAR PARK)</tspan></text>
    <text x="40" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#6b7280">TOWER: 3B + G + 1ST (PARKING) + 46 FLOORS · RERA CARPET: 2400 - 2415 SQ FT</text>
    
    <text x="780" y="536" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#785317">PRICE: ₹3.65 - 3.90 Cr*</text>
    <text x="780" y="550" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#8c8275">*SCHEMATIC BLUEPRINT · AUTHORIZED CHANNEL PARTNER M&amp;A VENTURES</text>
  </g>
</svg>